<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oslo Whiskyfestival 2026</title>
    <!-- Anonym besøkstelling (GoatCounter, ingen cookies). Teller #/-skjermene, men aldri innholdet i delte lister. -->
    <script>
      window.goatcounter = {
        path: function () {
          return location.pathname + location.hash.replace(/^#liste=.*/, '#liste')
        },
      }
    </script>
    <script data-goatcounter="https://owf26.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
